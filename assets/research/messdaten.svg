<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Vergleich mit Messdaten — Forschungsschema</title><desc id="desc">Vom Modell zur prüfbaren Vorhersage. Befunde: Schranken gesammelt; S301 geprüft. Keine beobachtbare Netzvorhersage. Offen: Eigene quantitative Vorhersagen testen.. Subjektiver Entwicklungsstand 5 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 11</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Vergleich mit Messdaten</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Vom Modell zur prüfbaren Vorhersage</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">5 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="8.5" height="5" rx="2" fill="#60dbc2"/><rect x="60" y="192" width="90" height="65" rx="12" fill="#16283e" stroke="#86aaff"/><text x="105" y="231" font-size="17" fill="#f2f5fa" font-weight="500" text-anchor="middle">Modell</text><rect x="180" y="192" width="90" height="65" rx="12" fill="#16283e" stroke="#f6c776"/><text x="225" y="231" font-size="17" fill="#f2f5fa" font-weight="500" text-anchor="middle">Prognose</text><rect x="310" y="192" width="90" height="65" rx="12" fill="#16283e" stroke="#60dbc2"/><text x="355" y="231" font-size="17" fill="#f2f5fa" font-weight="500" text-anchor="middle">Daten</text><line x1="153" y1="225" x2="175" y2="225" stroke="#acb8cd" stroke-width="2" stroke-dasharray="7 7"/><line x1="273" y1="225" x2="303" y2="225" stroke="#acb8cd" stroke-width="2" stroke-dasharray="7 7"/><text x="225" y="298" font-size="20" fill="#f6c776" font-weight="400" text-anchor="middle">Abgleich noch offen</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Schranken → konkrete Vorhersagen</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Schranken gesammelt; S301 geprüft.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Keine beobachtbare Netzvorhersage.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Eigene quantitative Vorhersagen testen.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Texte Stand 10.10.2026 (explorativ, Gegenlesung offen) · Prozente unverändert seit 07.10.2026</text></g></svg>