<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Materiefeld · Q-Bälle — Forschungsschema</title><desc id="desc">Ein gebundener Feldklumpen. Befunde: Klassische Vielteilchen-Objekte. Für 2–5 Quanten keine belastbare Bindung. Offen: Mechanismus für kleine Teilchenmassen.. Subjektiver Entwicklungsstand 30 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 04</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Materiefeld · Q-Bälle</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Ein gebundener Feldklumpen</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">30 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="51.0" height="5" rx="2" fill="#60dbc2"/><circle cx="225" cy="235" r="92" stroke="#60dbc2" stroke-width="2" fill="none"/><circle cx="225" cy="235" r="70" stroke="#60dbc2" stroke-width="2" fill="none"/><circle cx="225" cy="235" r="47" stroke="#60dbc2" stroke-width="2" fill="none"/><circle cx="225" cy="235" r="22" stroke="#60dbc2" stroke-width="2" fill="none"/><circle cx="195" cy="225" r="5" stroke="#86aaff" stroke-width="2" fill="#86aaff"/><circle cx="242" cy="205" r="5" stroke="#86aaff" stroke-width="2" fill="#86aaff"/><circle cx="239" cy="258" r="5" stroke="#86aaff" stroke-width="2" fill="#86aaff"/><circle cx="204" cy="266" r="5" stroke="#86aaff" stroke-width="2" fill="#86aaff"/><circle cx="264" cy="232" r="5" stroke="#86aaff" stroke-width="2" fill="#86aaff"/><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Q: erhaltene Modellladung</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Klassische Vielteilchen-Objekte.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Für 2–5 Quanten keine belastbare Bindung.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Mechanismus für kleine Teilchenmassen.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Texte Stand 10.10.2026 (explorativ, Gegenlesung offen) · Prozente unverändert seit 07.10.2026</text></g></svg>