<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Spin ½ — Forschungsschema</title><desc id="desc">Drehung, Vorzeichen, Statistik. Befunde: 2π-Vorzeichen als zusätzliche Regel. Spin und Statistik noch nicht vereint. Offen: Gemeinsame Dynamik statt Vorgabe.. Subjektiver Entwicklungsstand 20 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 07</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Spin ½</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Drehung, Vorzeichen, Statistik</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">20 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="34.0" height="5" rx="2" fill="#60dbc2"/><path d="M 170 167 C 55 200 100 310 215 284 C 355 248 345 125 235 164 C 125 205 190 303 326 266" fill="none" stroke="#60dbc2" stroke-width="5"/><text x="124" y="153" font-size="22" fill="#f6c776" font-weight="400" text-anchor="start">2π</text><text x="318" y="310" font-size="22" fill="#86aaff" font-weight="400" text-anchor="start">4π</text><text x="226" y="230" font-size="29" fill="#f2f5fa" font-weight="600" text-anchor="middle">− / +</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Vorzeichenregel · keine Herleitung</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">2π-Vorzeichen als zusätzliche Regel.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Spin und Statistik noch nicht vereint.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Gemeinsame Dynamik statt Vorgabe.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Stand 07.10.2026 · Befunde und Grenzen: verlinkte Projektberichte</text></g></svg>