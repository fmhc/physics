<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Generationen — Forschungsschema</title><desc id="desc">Warum drei Teilchenfamilien?. Befunde: 64 Flussmuster: keine isolierten Knoten. Einstellbare Massen sind keine Vorhersage. Offen: Drei Familien und ihre Hierarchie erklären.. Subjektiver Entwicklungsstand 2 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 10</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Generationen</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Warum drei Teilchenfamilien?</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">2 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="3.4" height="5" rx="2" fill="#60dbc2"/><rect x="90" y="165" width="70" height="126" rx="14" fill="#16283e" stroke="#86aaff" stroke-dasharray="6 6"/><text x="125" y="212" font-size="27" fill="#f2f5fa" font-weight="600" text-anchor="middle">I</text><text x="125" y="265" font-size="26" fill="#f6c776" font-weight="600" text-anchor="middle">?</text><rect x="200" y="165" width="70" height="126" rx="14" fill="#16283e" stroke="#86aaff" stroke-dasharray="6 6"/><text x="235" y="212" font-size="27" fill="#f2f5fa" font-weight="600" text-anchor="middle">II</text><text x="235" y="265" font-size="26" fill="#f6c776" font-weight="600" text-anchor="middle">?</text><rect x="310" y="165" width="70" height="126" rx="14" fill="#16283e" stroke="#86aaff" stroke-dasharray="6 6"/><text x="345" y="212" font-size="27" fill="#f2f5fa" font-weight="600" text-anchor="middle">III</text><text x="345" y="265" font-size="26" fill="#f6c776" font-weight="600" text-anchor="middle">?</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Ziel: drei Familien, kein Modellresultat</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">64 Flussmuster: keine isolierten Knoten.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Einstellbare Massen sind keine Vorhersage.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Drei Familien und ihre Hierarchie erklären.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Texte Stand 10.10.2026 (explorativ, Gegenlesung offen) · Prozente unverändert seit 07.10.2026</text></g></svg>