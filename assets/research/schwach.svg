<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Schwache Kraft — Forschungsschema</title><desc id="desc">Gesucht: chirale Wechselwirkung. Befunde: Literatur und Modellabgleich vorhanden. Kein eigener tragender Mechanismus. Offen: Chiralität und passende Eichkopplung.. Subjektiver Entwicklungsstand 2 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 08</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Schwache Kraft</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Gesucht: chirale Wechselwirkung</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">2 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="3.4" height="5" rx="2" fill="#60dbc2"/><circle cx="110" cy="215" r="33" stroke="#86aaff" stroke-width="2" fill="#132a35"/><text x="110" y="223" font-size="25" fill="#f2f5fa" font-weight="600" text-anchor="middle">L</text><circle cx="340" cy="215" r="33" stroke="#f6c776" stroke-width="2" fill="#132a35"/><text x="340" y="223" font-size="25" fill="#f2f5fa" font-weight="600" text-anchor="middle">R</text><line x1="151" y1="215" x2="298" y2="215" stroke="#acb8cd" stroke-width="3" stroke-dasharray="7 7"/><text x="225" y="205" font-size="40" fill="#60dbc2" font-weight="600" text-anchor="middle">?</text><text x="225" y="285" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="middle">ungleiche Kopplung gesucht</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Chirale Dynamik fehlt</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Literatur und Modellabgleich vorhanden.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Kein eigener tragender Mechanismus.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Chiralität und passende Eichkopplung.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Stand 07.10.2026 · Befunde und Grenzen: verlinkte Projektberichte</text></g></svg>