<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Licht — Forschungsschema</title><desc id="desc">Feld auf Kanten und Flächen. Befunde: DEC-Maxwell, masseloser Modus. Schichtnetz V×Z: Form positiv (Stichprobe). Offen: Kopplung ableiten; Gewichte bleiben frei.. Subjektiver Entwicklungsstand 55 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 03</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Licht</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Feld auf Kanten und Flächen</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">55 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="93.5" height="5" rx="2" fill="#60dbc2"/><line x1="55" y1="260" x2="100" y2="220" stroke="#2c425c" stroke-width="2"/><line x1="100" y1="220" x2="145" y2="260" stroke="#2c425c" stroke-width="2"/><line x1="145" y1="260" x2="190" y2="220" stroke="#2c425c" stroke-width="2"/><line x1="190" y1="220" x2="235" y2="260" stroke="#2c425c" stroke-width="2"/><line x1="235" y1="260" x2="280" y2="220" stroke="#2c425c" stroke-width="2"/><line x1="280" y1="220" x2="325" y2="260" stroke="#2c425c" stroke-width="2"/><path d="M 55 230 C 85 145 110 145 140 230 S 195 315 225 230 S 280 145 310 230 S 365 315 395 230" fill="none" stroke="#60dbc2" stroke-width="4"/><line x1="75" y1="305" x2="365" y2="305" stroke="#86aaff" stroke-width="2"/><text x="375" y="311" font-size="25" fill="#86aaff" font-weight="400" text-anchor="start">→</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Wellenmodus · schematisch</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">DEC-Maxwell, masseloser Modus.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Schichtnetz V×Z: Form positiv (Stichprobe).</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Kopplung ableiten; Gewichte bleiben frei.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Texte Stand 10.10.2026 (explorativ, Gegenlesung offen) · Prozente unverändert seit 07.10.2026</text></g></svg>