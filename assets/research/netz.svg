<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Netz und Raum — Forschungsschema</title><desc id="desc">Geometrie als Ausgangspunkt. Befunde: Tetraeder, Kanten und Gewichte. Volumenregel: 3 von 4 Testnetzen stabil. Offen: Nichtlineare Dynamik und Netzherkunft.. Subjektiver Entwicklungsstand 65 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 01</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Netz und Raum</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Geometrie als Ausgangspunkt</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">65 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="110.5" height="5" rx="2" fill="#60dbc2"/><line x1="100" y1="270" x2="215" y2="290" stroke="#60dbc2" stroke-width="2"/><line x1="100" y1="270" x2="165" y2="145" stroke="#60dbc2" stroke-width="2"/><line x1="215" y1="290" x2="165" y2="145" stroke="#60dbc2" stroke-width="2"/><line x1="215" y1="290" x2="320" y2="240" stroke="#60dbc2" stroke-width="2"/><line x1="165" y1="145" x2="320" y2="240" stroke="#60dbc2" stroke-width="2"/><line x1="165" y1="145" x2="275" y2="130" stroke="#60dbc2" stroke-width="2"/><line x1="320" y1="240" x2="275" y2="130" stroke="#60dbc2" stroke-width="2"/><line x1="215" y1="290" x2="275" y2="130" stroke="#60dbc2" stroke-width="2"/><circle cx="100" cy="270" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="215" cy="290" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="165" cy="145" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="320" cy="240" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="275" cy="130" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Kanten · Flächen · Volumen</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Tetraeder, Kanten und Gewichte.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Volumenregel: 3 von 4 Testnetzen stabil.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Nichtlineare Dynamik und Netzherkunft.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Stand 07.10.2026 · Befunde und Grenzen: verlinkte Projektberichte</text></g></svg>