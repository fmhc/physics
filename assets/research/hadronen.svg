<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Mesonen und Baryonen — Forschungsschema</title><desc id="desc">Gebundene Paare und Dreier?. Befunde: Dreipol-Modelle zeigen Bindung. U(1)³: noch kein Baryonennachweis. Offen: Farbeinschluss, Spin und Quantenzahlen.. Subjektiver Entwicklungsstand 10 Prozent, kein Messwert.</desc><rect width="1000" height="480" rx="22" fill="#0b1423"/><rect x="1" y="1" width="998" height="478" rx="21" fill="none" stroke="#2d3a4e"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="43" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">FORSCHUNGSATLAS / 06</text><text x="35" y="90" font-size="31" fill="#f2f5fa" font-weight="600" text-anchor="start">Mesonen und Baryonen</text><text x="35" y="120" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="start">Gebundene Paare und Dreier?</text><text x="960" y="67" font-size="31" fill="#60dbc2" font-weight="600" text-anchor="end">10 %</text><text x="960" y="92" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="end">subjektive Schätzung</text><rect x="790" y="108" width="170" height="5" rx="2" fill="#26374c"/><rect x="790" y="108" width="17.0" height="5" rx="2" fill="#60dbc2"/><line x1="85" y1="215" x2="170" y2="215" stroke="#f6c776" stroke-width="4" stroke-dasharray="7 7"/><circle cx="85" cy="215" r="19" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="170" cy="215" r="19" stroke="#86aaff" stroke-width="2" fill="#132a35"/><line x1="285" y1="168" x2="245" y2="285" stroke="#60dbc2" stroke-width="2"/><line x1="245" y1="285" x2="365" y2="265" stroke="#60dbc2" stroke-width="2"/><line x1="365" y1="265" x2="285" y2="168" stroke="#60dbc2" stroke-width="2"/><circle cx="285" cy="168" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="245" cy="285" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="365" cy="265" r="5" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="285" cy="168" r="19" stroke="#60dbc2" stroke-width="2" fill="#132a35"/><circle cx="245" cy="285" r="19" stroke="#86aaff" stroke-width="2" fill="#132a35"/><circle cx="365" cy="265" r="19" stroke="#f6c776" stroke-width="2" fill="#132a35"/><text x="128" y="287" font-size="18" fill="#acb8cd" font-weight="400" text-anchor="middle">Paar?</text><text x="225" y="345" font-size="17" fill="#acb8cd" font-weight="400" text-anchor="middle">Modellanalogie ≠ Hadronennachweis</text><line x1="454" y1="160" x2="454" y2="360" stroke="#26374c" stroke-width="1"/><text x="490" y="181" font-size="13" fill="#60dbc2" font-weight="600" text-anchor="start">BEFUNDE / VORARBEITEN</text><text x="490" y="217" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Dreipol-Modelle zeigen Bindung.</text><text x="490" y="246" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">U(1)³: noch kein Baryonennachweis.</text><text x="490" y="291" font-size="13" fill="#f6c776" font-weight="600" text-anchor="start">OFFENE FRAGE</text><text x="490" y="323" font-size="18" fill="#f2f5fa" font-weight="400" text-anchor="start">Farbeinschluss, Spin und Quantenzahlen.</text><line x1="35" y1="391" x2="965" y2="391" stroke="#26374c" stroke-width="1"/><text x="35" y="423" font-size="14" fill="#acb8cd" font-weight="400" text-anchor="start">SCHEMA · keine Messdaten · keine maßstäbliche Darstellung</text><text x="35" y="449" font-size="13" fill="#acb8cd" font-weight="400" text-anchor="start">Stand 07.10.2026 · Befunde und Grenzen: verlinkte Projektberichte</text></g></svg>